# ForestWatch VPS Nginx config
# Copy to /etc/nginx/sites-available/forestwatch
# Then: ln -s /etc/nginx/sites-available/forestwatch /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx

server {
    listen 80;
    server_name _;  # Accept any host (or replace with your domain)

    client_max_body_size 20M;  # Allow photo uploads up to 20MB

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
